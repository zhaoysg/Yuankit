name: YuanKit source synchronization
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-v05.yml'
      - '.sync-v05/ready.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify synchronization runner
        run: python3 -c "print('YuanKit v0.5 source synchronization runner is available')"
