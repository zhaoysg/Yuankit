e{overflow:auto}.studio-api table{font-size:11px;width:100%;border-collapse:collapse}.studio-api th,.studio-api td{padding:10px;text-align:left;border-bottom:1px solid var(--yk-border);vertical-align:top}.studio-api th{color:var(--yk-text-muted);background:var(--yk-muted)}.studio-api td code{font-size:10px;overflow-wrap:anywhere}.studio-api td small{display:block;color:var(--yk-text-muted);margin-top:5px}.studio-api pre{font-size:11px;background:var(--yk-muted);padding:15px;overflow:auto}.studio-api__chips{display:flex;flex-wrap:wrap;gap:8px}.studio-api__chips span{font-size:10px;background:var(--yk-muted);padding:6px 8px;border-radius:5px}.inspector-item-editor{border:1px solid var(--yk-border);border-radius:7px;padding:7px}.inspector-item-editor details{font-size:11px;color:var(--yk-text-muted)}.inspector-item-editor summary{padding:7px 0;cursor:pointer}.inspector-item-editor textarea{width:100%;font:inherit;font-size:11px;color:var(--yk-text);border:1px solid var(--yk-border);background:var(--yk-surface);border-radius:5px;padding:7px;resize:vertical}.inspector-item-editor details label{display:flex;align-items:center;gap:7px;margin:8px 0}.inspector-item-editor .inspector-item{grid-template-columns:minmax(0,1fr) auto}
@media(max-width:680px){.studio-gallery,.studio-api{padding:15px}.studio-gallery__grid{grid-template-columns:1fr}.studio-gallery__header{flex-wrap:wrap}.studio-gallery h3{font-size:20px}.studio-gallery__preview{height:190px}}
/* Studio owns its asset navigation. Do not overlay the legacy documentation rail,
   especially above docs.css's 1700px centered-layout breakpoint. */
.app-shell:has(.studio-page)>.sidebar:not(.is-open){display:none}
.app-shell:has(.studio-page)>.main-content{margin-left:0;margin-right:0;max-width:none;padding-left:28px;padding-right:28px}
.studio-top-actions{top:80px}
.header-center a{color:var(--yk-text-muted);text-decoration:none;font-size:12px}
.header-center a:hover{color:var(--yk-primary)}
@media(max-width:760px){.app-shell:has(.studio-page)>.main-content{padding-left:12px;padding-right:12px}.studio-top-actions{position:static}}
